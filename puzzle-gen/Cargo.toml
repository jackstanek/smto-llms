[package]
name = "puzzle-gen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
log = "0.4.29"
env_logger = "0.11"
rand = "0.10.1"
rand_distr = "0.6.0"
slotmap = "1.1.1"
smtlib = { version = "0.3.0", optional = true }
itertools = "0.14.0"
rig-core = "0.35.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
askama = "0.16.0"
thiserror = "2.0.18"
async-trait = "0.1.89"
clingo = { version = "0.8.0", optional = true }

[features]
default = ["smt", "asp"]
smt = ["dep:smtlib"]
asp = ["dep:clingo"]
